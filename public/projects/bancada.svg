<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="60" x2="1080" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#231A13" />
      <stop offset="0.5" stop-color="#0D0F0E" />
      <stop offset="1" stop-color="#171916" />
    </linearGradient>
    <linearGradient id="stage" x1="130" y1="126" x2="885" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#201913" />
      <stop offset="1" stop-color="#11120F" />
    </linearGradient>
    <linearGradient id="dish" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E1BC80" />
      <stop offset="1" stop-color="#A86C38" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <pattern id="grain" width="54" height="54" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="1" fill="#C99552" fill-opacity="0.08" />
      <circle cx="39" cy="31" r="1" fill="#F2EDE3" fill-opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />
  <rect width="1200" height="800" fill="url(#grain)" />
  <rect x="80" y="70" width="1040" height="660" rx="28" fill="#0D0F0E" stroke="#755638" stroke-opacity="0.75" stroke-width="2" filter="url(#shadow)" />
  <rect x="80" y="70" width="1040" height="4" rx="2" fill="#C99552" />

  <g transform="translate(124 105)">
    <rect width="34" height="38" fill="#11120F" stroke="#C99552" />
    <path d="M9 9H18.5C23.2 9 26 11.4 26 15.1C26 17.8 24.4 19.7 21.8 20.5C25 21.2 27 23.5 27 26.7C27 30.9 23.8 33 18.7 33H9V9ZM14 13V18.8H18.2C20.2 18.8 21.3 17.8 21.3 15.9C21.3 14 20.1 13 18.2 13H14ZM14 22.6V29H18.4C20.8 29 22 27.9 22 25.8C22 23.7 20.7 22.6 18.4 22.6H14Z" fill="#C99552" />
    <text x="50" y="20" fill="#F2EDE3" font-family="Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="2">BANCADA</text>
    <text x="50" y="35" fill="#AAA79D" font-family="Arial, sans-serif" font-size="7" font-weight="700" letter-spacing="2.1">RECEITAS FEITAS EM CASA</text>
  </g>

  <g fill="#AAA79D" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">
    <text x="690" y="131">EXPLORAR</text>
    <text x="778" y="131">DESAFIOS</text>
    <text x="870" y="131">CAIXA MISTERIOSA</text>
  </g>
  <rect x="1012" y="111" width="72" height="32" fill="#C99552" />
  <text x="1048" y="131" fill="#11120F" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="1">ENTRAR</text>

  <rect x="110" y="168" width="980" height="355" fill="url(#stage)" stroke="#393C36" />
  <line x1="144" y1="168" x2="144" y2="523" stroke="#755638" stroke-opacity="0.75" />
  <text x="176" y="223" fill="#BD5135" font-family="Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="2.4">TÉCNICA, REPERTÓRIO E CORAGEM PARA TESTAR</text>
  <text x="176" y="292" fill="#F5EADC" font-family="Georgia, serif" font-size="58" letter-spacing="-2">Seu melhor prato</text>
  <text x="176" y="353" fill="#F5EADC" font-family="Georgia, serif" font-size="58" letter-spacing="-2">começa na bancada.</text>
  <text x="176" y="395" fill="#C6B7A5" font-family="Arial, sans-serif" font-size="14">Publique receitas, encare novas provas e descubra</text>
  <text x="176" y="417" fill="#C6B7A5" font-family="Arial, sans-serif" font-size="14">como outros cozinheiros resolveram o mesmo ingrediente.</text>
  <rect x="176" y="452" width="176" height="42" fill="#C99552" />
  <text x="264" y="477" fill="#11120F" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1.2">MONTAR MINHA BANCADA</text>

  <rect x="782" y="168" width="308" height="355" fill="#1E1813" fill-opacity="0.92" stroke="#755638" />
  <text x="814" y="211" fill="#C99552" font-family="Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="2">EDIÇÃO ABERTA</text>
  <text x="811" y="376" fill="#C99552" fill-opacity="0.72" font-family="Georgia, serif" font-size="152">01</text>
  <line x1="814" y1="411" x2="1058" y2="411" stroke="#755638" />
  <text x="814" y="442" fill="#C6B7A5" font-family="Georgia, serif" font-size="13">Não existe um único prato certo.</text>
  <text x="814" y="462" fill="#C6B7A5" font-family="Georgia, serif" font-size="13">Existe técnica, escolha e a história</text>
  <text x="814" y="482" fill="#C6B7A5" font-family="Georgia, serif" font-size="13">que você coloca no prato.</text>

  <g transform="translate(110 553)">
    <text x="0" y="18" fill="#BD5135" font-family="Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="2">SERVIDOS AGORA</text>
    <text x="0" y="57" fill="#F2EDE3" font-family="Georgia, serif" font-size="31">Novos pratos na bancada</text>
    <line x1="0" y1="77" x2="980" y2="77" stroke="#393C36" />

    <g transform="translate(0 98)">
      <rect width="305" height="60" fill="#171916" stroke="#393C36" />
      <rect width="305" height="3" fill="#C99552" />
      <circle cx="38" cy="32" r="19" fill="#2B2118" stroke="#755638" />
      <circle cx="38" cy="32" r="12" fill="url(#dish)" />
      <path d="M30 32C34 26 42 26 47 32C43 37 35 38 30 32Z" fill="#BD5135" />
      <text x="70" y="28" fill="#F2EDE3" font-family="Georgia, serif" font-size="15">Pão de queijo de tabuleiro</text>
      <text x="70" y="45" fill="#D0AB74" font-family="Arial, sans-serif" font-size="8" letter-spacing="1">45 MIN · FÁCIL</text>
    </g>

    <g transform="translate(337 98)">
      <rect width="305" height="60" fill="#171916" stroke="#393C36" />
      <rect width="305" height="3" fill="#C99552" />
      <circle cx="38" cy="32" r="19" fill="#2B2118" stroke="#755638" />
      <circle cx="38" cy="32" r="12" fill="#C99552" />
      <circle cx="34" cy="29" r="3" fill="#F2EDE3" />
      <circle cx="43" cy="35" r="2.5" fill="#BD5135" />
      <text x="70" y="28" fill="#F2EDE3" font-family="Georgia, serif" font-size="15">Moqueca da casa</text>
      <text x="70" y="45" fill="#D0AB74" font-family="Arial, sans-serif" font-size="8" letter-spacing="1">60 MIN · MÉDIO</text>
    </g>

    <g transform="translate(675 98)">
      <rect width="305" height="60" fill="#3B211A" stroke="#A65F49" />
      <rect width="305" height="3" fill="#BD5135" />
      <text x="22" y="25" fill="#FFF1E8" font-family="Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="1.4">CAIXA MISTERIOSA</text>
      <text x="22" y="45" fill="#E3BCAE" font-family="Georgia, serif" font-size="13">Quatro ingredientes. Uma criação.</text>
      <path d="M270 21L282 30L270 39" stroke="#D38F77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
